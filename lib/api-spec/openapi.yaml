openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Heritage Credit Union API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: accounts
    description: Account operations
  - name: transactions
    description: Transaction operations
  - name: transfers
    description: Transfer operations
  - name: external-payees
    description: External payee management
  - name: external-transfers
    description: External transfer operations
  - name: bills
    description: Bill pay operations
  - name: loans
    description: Loan operations
  - name: cards
    description: Card operations
  - name: statements
    description: Statement operations
  - name: member
    description: Member profile operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get currently authenticated user
      responses:
        "200":
          description: Current session user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /member:
    get:
      operationId: getMember
      tags: [member]
      summary: Get member profile
      responses:
        "200":
          description: Member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /accounts:
    get:
      operationId: getAccounts
      tags: [accounts]
      summary: List all accounts
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /accounts/summary:
    get:
      operationId: getAccountSummary
      tags: [accounts]
      summary: Get account summary
      responses:
        "200":
          description: Account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSummary"

  /accounts/{accountId}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get a single account
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /transactions:
    get:
      operationId: getTransactions
      tags: [transactions]
      summary: List transactions
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transactions/recent:
    get:
      operationId: getRecentTransactions
      tags: [transactions]
      summary: Get recent transactions
      responses:
        "200":
          description: Recent transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transfers:
    get:
      operationId: getTransfers
      tags: [transfers]
      summary: List internal transfers
      responses:
        "200":
          description: List of transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transfer"
    post:
      operationId: createTransfer
      tags: [transfers]
      summary: Create an internal transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"

  /transfers/{transferId}/receipt:
    get:
      operationId: getTransferReceipt
      tags: [transfers]
      summary: Get receipt data for a transfer
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transfer receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferReceipt"
        "404":
          description: Transfer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /external-payees:
    get:
      operationId: getExternalPayees
      tags: [external-payees]
      summary: List saved external payees
      responses:
        "200":
          description: List of external payees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalPayee"
    post:
      operationId: createExternalPayee
      tags: [external-payees]
      summary: Save a new external payee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalPayeeInput"
      responses:
        "201":
          description: Payee saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalPayee"

  /external-payees/verify:
    post:
      operationId: verifyExternalAccount
      tags: [external-payees]
      summary: Verify a routing and account number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyAccountBody"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyAccountResult"

  /external-payees/{payeeId}:
    delete:
      operationId: deleteExternalPayee
      tags: [external-payees]
      summary: Remove a saved payee
      parameters:
        - name: payeeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payee removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /validate-routing/{routingNumber}:
    get:
      operationId: getValidateRouting
      tags: [external-payees]
      summary: Look up an ABA routing number (checksum + known bank directory)
      parameters:
        - name: routingNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Routing lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingLookupResult"

  /external-transfers:
    get:
      operationId: getExternalTransfers
      tags: [external-transfers]
      summary: List external transfers
      responses:
        "200":
          description: List of external transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalTransfer"
    post:
      operationId: createExternalTransfer
      tags: [external-transfers]
      summary: Send money to an external account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalTransferInput"
      responses:
        "201":
          description: External transfer initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalTransfer"

  /bills:
    get:
      operationId: getBills
      tags: [bills]
      summary: List bill payees
      responses:
        "200":
          description: List of bills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bill"
    post:
      operationId: payBill
      tags: [bills]
      summary: Pay a bill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillPayInput"
      responses:
        "201":
          description: Payment submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillPayment"

  /loans:
    get:
      operationId: getLoans
      tags: [loans]
      summary: List member loans
      responses:
        "200":
          description: List of loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"

  /cards:
    get:
      operationId: getCards
      tags: [cards]
      summary: List member cards
      responses:
        "200":
          description: List of cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Card"

  /cards/{cardId}/status:
    patch:
      operationId: updateCardStatus
      tags: [cards]
      summary: Update card status (freeze/unfreeze)
      parameters:
        - name: cardId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardStatusBody"
      responses:
        "200":
          description: Card updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"

  /statements:
    get:
      operationId: getStatements
      tags: [statements]
      summary: List statements
      responses:
        "200":
          description: List of statements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Statement"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [email]
      properties:
        email:
          type: string

    Member:
      type: object
      required: [id, firstName, lastName, memberNumber, email, phone, address, city, state, zip, memberSince, status]
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        memberNumber:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        memberSince:
          type: string
        status:
          type: string

    Account:
      type: object
      required: [id, type, nickname, maskedNumber, balance, availableBalance, interestRate, status, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [checking, savings, money_market, cd]
        nickname:
          type: string
        maskedNumber:
          type: string
        balance:
          type: number
        availableBalance:
          type: number
        interestRate:
          type: number
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    AccountSummary:
      type: object
      required: [totalBalance, monthlyDeposits, monthlySpending, accountStatus, checkingBalance, savingsBalance]
      properties:
        totalBalance:
          type: number
        checkingBalance:
          type: number
        savingsBalance:
          type: number
        monthlyDeposits:
          type: number
        monthlySpending:
          type: number
        accountStatus:
          type: string

    Transaction:
      type: object
      required: [id, accountId, description, amount, type, category, date, balance]
      properties:
        id:
          type: integer
        accountId:
          type: integer
        description:
          type: string
        amount:
          type: number
        type:
          type: string
          enum: [credit, debit]
        category:
          type: string
        date:
          type: string
        balance:
          type: number
        merchant:
          type: ["string", "null"]

    Transfer:
      type: object
      required: [id, fromAccountId, toAccountId, amount, date, status, memo, referenceNumber]
      properties:
        id:
          type: integer
        fromAccountId:
          type: integer
        toAccountId:
          type: integer
        amount:
          type: number
        date:
          type: string
        status:
          type: string
          enum: [pending, pending_reversal, completed, reversed, failed]
        memo:
          type: string
        referenceNumber:
          type: string
        reversedAt:
          type: ["string", "null"]
          format: date-time

    TransferReceipt:
      type: object
      required: [id, referenceNumber, date, amount, fromAccount, toAccount, status, memo]
      properties:
        id:
          type: integer
        referenceNumber:
          type: string
        date:
          type: string
        amount:
          type: number
        fromAccount:
          type: string
        toAccount:
          type: string
        status:
          type: string
        memo:
          type: string
        reversedAt:
          type: ["string", "null"]

    TransferInput:
      type: object
      required: [fromAccountId, toAccountId, amount]
      properties:
        fromAccountId:
          type: integer
        toAccountId:
          type: integer
        amount:
          type: number
        memo:
          type: string

    ExternalPayee:
      type: object
      required: [id, nickname, recipientName, routingNumber, accountNumber, bankName, accountType, createdAt]
      properties:
        id:
          type: integer
        nickname:
          type: string
        recipientName:
          type: string
        routingNumber:
          type: string
        accountNumber:
          type: string
        bankName:
          type: string
        accountType:
          type: string
        createdAt:
          type: string
          format: date-time

    ExternalPayeeInput:
      type: object
      required: [nickname, recipientName, routingNumber, accountNumber]
      properties:
        nickname:
          type: string
        recipientName:
          type: string
        routingNumber:
          type: string
        accountNumber:
          type: string
        bankName:
          type: string
        accountType:
          type: string

    VerifyAccountBody:
      type: object
      required: [routingNumber, accountNumber]
      properties:
        routingNumber:
          type: string
        accountNumber:
          type: string

    VerifyAccountResult:
      type: object
      required: [verified, bankName, routingNumber]
      properties:
        verified:
          type: boolean
        bankName:
          type: string
        routingNumber:
          type: string
        message:
          type: string

    RoutingLookupResult:
      type: object
      required: [valid, routingNumber, message]
      properties:
        valid:
          type: boolean
        bankName:
          type: string
          nullable: true
        routingNumber:
          type: string
        message:
          type: string

    ExternalTransfer:
      type: object
      required: [id, fromAccountId, externalPayeeId, amount, memo, status, date, createdAt]
      properties:
        id:
          type: integer
        fromAccountId:
          type: integer
        externalPayeeId:
          type: integer
        amount:
          type: number
        memo:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        date:
          type: string
        createdAt:
          type: string
          format: date-time

    ExternalTransferInput:
      type: object
      required: [fromAccountId, externalPayeeId, amount]
      properties:
        fromAccountId:
          type: integer
        externalPayeeId:
          type: integer
        amount:
          type: number
        memo:
          type: string

    Bill:
      type: object
      required: [id, payeeName, accountNumber, dueDate, amountDue, category, autopay]
      properties:
        id:
          type: integer
        payeeName:
          type: string
        accountNumber:
          type: string
        dueDate:
          type: string
        amountDue:
          type: number
        category:
          type: string
        autopay:
          type: boolean
        lastPaidDate:
          type: ["string", "null"]
        lastPaidAmount:
          type: ["number", "null"]

    BillPayInput:
      type: object
      required: [billId, amount, fromAccountId, payDate]
      properties:
        billId:
          type: integer
        amount:
          type: number
        fromAccountId:
          type: integer
        payDate:
          type: string

    BillPayment:
      type: object
      required: [id, billId, amount, fromAccountId, payDate, status]
      properties:
        id:
          type: integer
        billId:
          type: integer
        amount:
          type: number
        fromAccountId:
          type: integer
        payDate:
          type: string
        status:
          type: string

    Loan:
      type: object
      required: [id, type, originalAmount, currentBalance, monthlyPayment, interestRate, nextPaymentDate, nextPaymentAmount, termMonths, status]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [auto, home, personal, student]
        nickname:
          type: string
        originalAmount:
          type: number
        currentBalance:
          type: number
        monthlyPayment:
          type: number
        interestRate:
          type: number
        nextPaymentDate:
          type: string
        nextPaymentAmount:
          type: number
        termMonths:
          type: integer
        status:
          type: string

    Card:
      type: object
      required: [id, type, maskedNumber, cardholderName, expiryDate, status, creditLimit, currentBalance, availableCredit]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [debit, credit, prepaid]
        maskedNumber:
          type: string
        cardholderName:
          type: string
        expiryDate:
          type: string
        status:
          type: string
          enum: [active, frozen, cancelled]
        creditLimit:
          type: ["number", "null"]
        currentBalance:
          type: number
        availableCredit:
          type: ["number", "null"]
        rewardsPoints:
          type: ["integer", "null"]

    UpdateCardStatusBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, frozen, cancelled]

    Statement:
      type: object
      required: [id, accountId, period, startDate, endDate, openingBalance, closingBalance, totalCredits, totalDebits, pdfUrl]
      properties:
        id:
          type: integer
        accountId:
          type: integer
        period:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        openingBalance:
          type: number
        closingBalance:
          type: number
        totalCredits:
          type: number
        totalDebits:
          type: number
        pdfUrl:
          type: string
